name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

# Least Privilege: global nur Lesen. Schreibrechte für Pages und OIDC
# bekommt ausschließlich der Deploy-Job (Security-Audit 10/2026, N4).
# Actions sind auf volle Commit-SHAs gepinnt (Tags sind verschiebbar,
# Muster tj-actions/changed-files 03/2025). Update: SHA per
# `git ls-remote https://github.com/<owner>/<action> refs/tags/<tag>` holen.
permissions:
  contents: read

# Eine Gruppe je Ref: Ein neuer Lauf bricht nur den älteren Lauf desselben
# Branches ab. Mit einer gemeinsamen Gruppe brach ein manueller Start auf
# einem Test-Branch einen laufenden Produktions-Deploy von main ab.
# Deployt wird ohnehin nur main/master (Job deploy).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04 # fest statt ubuntu-latest (Image-Wechsel bewusst und getestet nachziehen)
    timeout-minutes: 10 # hängt ein Schritt, endet der Job nach 10 statt nach 360 min (Standard)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install tooling
        run: npm ci
      - name: Stylelint
        run: npm run lint:css
      - name: ESLint
        run: npm run lint:js
      - name: Schriftgrößen-Guardrail (Token-Skala)
        run: bash scripts/fs-guardrail.sh
      - name: Farb-Guardrail
        run: bash scripts/color-guardrail.sh
      - name: Skalen-Guardrail (Ratchet für Abstände, Radien, Schatten, Ebenen, Motion)
        run: bash scripts/scale-guardrail.sh
      - name: Breakpoint-Guardrail (Mixins, JS-Spiegel, Critical-CSS)
        run: bash scripts/bp-guardrail.sh
      - name: Security-Guardrail (Quellcode)
        run: bash scripts/security-guardrail.sh
      - name: SCSS-Format (Einrückung, Endleerzeichen)
        run: python3 scripts/scss-format.py
      - name: Versions-Gleichstand Dev Container (STYLEGUIDE DOC-7)
        run: bash scripts/version-sync-check.sh
      # content-check.py liest YAML über PyYAML oder Ruby. Keins von beiden
      # ist im lint-Job fest zugesagt (kein setup-ruby), also absichern
      - name: YAML-Leser für die Content-Fälle sicherstellen
        run: python3 -c 'import yaml' 2>/dev/null || command -v ruby >/dev/null || sudo apt-get install -y --no-install-recommends python3-yaml
      - name: Guardrail-Negativtests (absichtliche Verstöße müssen scheitern)
        run: python3 tests/guardrails/run.py

  build:
    runs-on: ubuntu-26.04 # fest statt ubuntu-latest (Image-Wechsel bewusst und getestet nachziehen)
    timeout-minutes: 30 # Reserve für Image-Download und Playwright (etwa 4,5 min)
    permissions:
      contents: read
      pages: read   # configure-pages liest die Pages-Konfiguration
    steps:
      # Volle Historie: jekyll-last-modified-at liest je Datei den letzten
      # Commit (git log). Im flachen Checkout trüge jede Seite das Datum des
      # Deploy-Commits als „Aktualisiert“, in sitemap.xml (lastmod) und im
      # JSON-LD (dateModified). Kostet etwa 50 MB statt 4 MB Download.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Ein Ort je Version (STYLEGUIDE.md DOC-7): der Cache-Schlüssel kommt aus
      # .ruby-version und der Bundler-Hauptversion in Gemfile.lock. Er hat die
      # Form des früheren festen Schlüssels (ruby-<Version>-bundler-<Haupt>).
      - name: Versionen aus den Versionsdateien
        id: versions
        run: |
          echo "ruby=$(cat .ruby-version)" >> "$GITHUB_OUTPUT"
          echo "bundler=$(awk '/^BUNDLED WITH/ { getline; split($1, v, "."); print v[1] }' Gemfile.lock)" >> "$GITHUB_OUTPUT"
      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
          cache-version: ruby-${{ steps.versions.outputs.ruby }}-bundler-${{ steps.versions.outputs.bundler }}
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      # Typische Inhaltsfehler mit Datei, Zeile und Lösung, bevor der Build sie
      # still durchlässt (STYLEGUIDE.md ARCH-5). Im Build-Job, weil Ruby hier
      # sicher da ist: Fehlt dem Runner PyYAML, liest das Skript YAML über Ruby
      - name: Inhalts-Check (Quellen)
        run: python3 scripts/content-check.py
      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      # quiet_deps verschluckt auch eigene Deprecations (alle Partials kommen
      # über den Load-Path), daher ein Zusatzlauf ohne (STYLEGUIDE.md SCSS-3)
      - name: Sass-Deprecation-Check (eigener Code)
        run: bash scripts/sass-deprecation-check.sh
      - name: Inhalts-Check (gebaute Beiträge, nur Warnungen)
        run: python3 scripts/content-check.py --site _site
      - name: Gate – Styleguide nie im Deploy (STYLEGUIDE.md SG-1)
        run: test ! -e _site/styleguide && test ! -e _site/assets/css/styleguide.css
      # exclude greift für Theme-Assets nur über _plugins/theme-assets-exclude.rb
      - name: Gate – ungenutzte Theme-Skripte nicht im Deploy (STYLEGUIDE.md SEC-8b)
        run: test ! -e _site/assets/js/main.min.js && test ! -e _site/assets/js/vendor && test ! -e _site/assets/js/lunr && test ! -e _site/assets/js/plugins
      # Fixture für Gastbeiträge (published: false), nur im Review-Build
      - name: Gate – Test-Gastbeitrag nie im Deploy (STYLEGUIDE.md INH-5)
        run: test ! -e _site/posts/test-gastbeitrag && ! grep -rqF "Test-Gastbeitrag" _site
      - name: CSP-Prüfung (gebaute Seiten)
        run: python3 scripts/csp-check.py _site
      # Interne Links und Anker, Bilder (Datei vorhanden, alt gesetzt) und
      # Skripte (Datei vorhanden) im Deploy-Build (STYLEGUIDE.md ARCH-5)
      - name: Interne Links, Bilder und Skripte (html-proofer)
        run: bundle exec htmlproofer _site --disable-external --no-enforce-https --checks Links,Images,Scripts --swap-urls "^/auflinie/:/"
      # Das Deploy-Artefakt entsteht VOR dem Playwright-Schritt: Der Container
      # läuft als root mit dem ganzen Arbeitsverzeichnis und installiert per
      # npm ci Fremdcode. Was er danach schreibt, erreicht weder _site im
      # Artefakt noch die Prüfskripte oben. Schlägt das Review fehl, deployt
      # der Job deploy trotzdem nicht (needs: build), das Artefakt verfällt
      # nach einem Tag.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          retention-days: 1
      - name: Review-Build mit Styleguide-Ansicht (wird nicht deployt)
        run: bundle exec jekyll build --unpublished -d _site_review
        env:
          JEKYLL_ENV: production
      # Automatisches Style-Guide-Review (STYLEGUIDE.md, Abschnitt 16):
      # Screenshot-Vergleich der Styleguide-Ansicht, Kontrast der Tokens,
      # axe-core WCAG 2.2 AA, Seitenwechsel und Service Worker. Läuft im
      # Playwright-Container, damit Schriften und Rendering mit den
      # Vergleichsbildern übereinstimmen (lokal identisch, siehe
      # playwright.config.js). Im Build-Job statt eigenem Job: kein
      # zusätzliches Artefakt (Storage-Limit, kontoweit).
      # Drei Engines aus demselben Image: Chromium alles, Firefox und WebKit
      # die Verhaltens-Tests (Projekte in playwright.config.js, etwa 4,5 min
      # statt 30 s). Hochgeladen wird der Bericht nur bei Fehlern (1 Tag),
      # Traces gibt es nur von fehlgeschlagenen Tests.
      # Image-Version = @playwright/test in package.json, per Digest gepinnt.
      - name: Style-Guide-Review (Playwright, Chromium, Firefox, WebKit)
        run: >
          docker run --rm --ipc=host -v "$PWD":/w -w /w -e CI=1
          mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
          bash -c "npm ci --no-audit --no-fund && npx playwright test"
      - name: Review-Bericht bei Fehlern
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 1

  deploy:
    # Nur produktive Branches veröffentlichen (Test-Branches: Build ohne Deploy)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04 # fest statt ubuntu-latest (Image-Wechsel bewusst und getestet nachziehen)
    timeout-minutes: 10
    # lint gehört dazu: sonst deployt ein grüner Build trotz rotem Lint-Job
    # (das Style-Guide-Review läuft im Build-Job)
    needs: [build, lint]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
