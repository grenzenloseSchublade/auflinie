name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

# Least Privilege: global nur Lesen. Schreibrechte für Pages und OIDC
# bekommt ausschließlich der Deploy-Job (Security-Audit 10/2026, N4).
# Actions sind auf volle Commit-SHAs gepinnt (Tags sind verschiebbar,
# Muster tj-actions/changed-files 03/2025). Update: SHA per
# `git ls-remote https://github.com/<owner>/<action> refs/tags/<tag>` holen.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install tooling
        run: npm ci
      - name: Stylelint
        run: npm run lint:css
      - name: ESLint
        run: npm run lint:js
      - name: Schriftgrößen-Guardrail (Token-Skala)
        run: bash scripts/fs-guardrail.sh
      - name: Security-Guardrail (Quellcode)
        run: bash scripts/security-guardrail.sh

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read   # configure-pages liest die Pages-Konfiguration
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
          cache-version: ruby-3.4.8-bundler-4
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: CSP-Prüfung (gebaute Seiten)
        run: python3 scripts/csp-check.py _site
      - name: Check internal links
        run: bundle exec htmlproofer _site --disable-external --no-enforce-https --checks Links --swap-urls "^/auflinie/:/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          retention-days: 1

  deploy:
    # Nur produktive Branches veröffentlichen (Test-Branches: Build ohne Deploy)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # lint gehört dazu: sonst deployt ein grüner Build trotz rotem Lint-Job
    needs: [build, lint]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
