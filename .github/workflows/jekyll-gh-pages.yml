name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main", "master", "test/**"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install tooling
        run: npm ci
      - name: Stylelint
        run: npm run lint:css

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: ruby-3.4.8-bundler-4
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Check internal links
        run: bundle exec htmlproofer _site --disable-external --no-enforce-https --checks Links --swap-urls "^/auflinie/:/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    # Nur produktive Branches veröffentlichen (Test-Branches: Build ohne Deploy)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
