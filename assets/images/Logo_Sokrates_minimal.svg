<svg viewBox="0 0 100 100" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Sokrates Profil - Minimalistisches Line-Art -->
  <!-- Blickrichtung: nach links -->
  
  <!-- Filter f�r Neon-Glow Effekt -->
  <defs>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-magenta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- CYAN: Kopfumriss, Gesicht, Nase, Ohr -->
  <g stroke="#05d9e8" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-cyan)">
    <!-- Stirn und Kopf oben -->
    <path d="M 30 25 
             Q 35 15, 50 12
             Q 70 10, 78 25
             Q 82 35, 80 50"/>
    
    <!-- Gesichtsprofil: Stirn, Nase, Lippen, Kinn -->
    <path d="M 30 25
             Q 28 30, 27 35
             L 20 48
             Q 18 50, 20 52
             Q 22 54, 25 55
             Q 27 58, 28 62
             Q 30 65, 32 68"/>
    
    <!-- Ohr -->
    <path d="M 68 42
             Q 72 42, 74 46
             Q 76 52, 72 56
             Q 68 58, 66 55"/>
    
    <!-- Auge - minimalistisch (nur 2 Striche) -->
    <path d="M 32 38 Q 36 36, 40 38"/>
    <path d="M 35 40 L 37 42"/>
  </g>
  
  <!-- MAGENTA: Haarlinie und Bart -->
  <g stroke="#ff00cc" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-magenta)">
    <!-- Haarlinie am Hinterkopf -->
    <path d="M 78 25
             Q 75 30, 72 38
             Q 70 45, 68 50
             L 66 55"/>
    
    <!-- Bart -->
    <path d="M 32 68
             Q 28 72, 25 78
             Q 22 84, 28 88
             Q 38 92, 50 88
             Q 58 85, 62 78
             Q 65 72, 66 65
             Q 67 60, 66 55"/>
    
    <!-- Schnurrbart-Andeutung -->
    <path d="M 25 55
             Q 28 58, 32 60
             Q 36 62, 38 65"/>
  </g>
</svg>
