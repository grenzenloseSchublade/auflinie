<!doctype html>
<!--
  Vorlage für das Vorschaubild beim Teilen (og:image, STYLEGUIDE SEO-3).
  Gerendert von scripts/og-image.js, dort stehen Aufruf und Hintergrund.

  Aufbau: Das Hero-Motiv liegt nur als background.jpg mit 675 × 360 px vor
  (Stockgrafik, keine größere Quelle). Hochgerechnet würde es weich. Darum
  zwei Ebenen:
  1. Grund: background.jpg ohne Sonne (Himmel knapp außerhalb nach innen
     gezogen), mit Median-Filter (Gitter und Sterne fallen weg, es bleiben
     die weichen Verläufe), dann auf Zielgröße gezogen. Verläufe vertragen
     das Hochrechnen ohne sichtbaren Verlust.
  2. Alles Scharfe als SVG darüber, vermessen am Original: Himmelsgitter,
     Sonne mit Streifen, Sterne, Horizontlinie, Bodengitter. Koordinaten in
     Pixeln von background.jpg (viewBox 675 × 360), „slice“ schneidet wie
     background-size: cover.
  Darüber wie im Hero 50 % Schwarz (IMG-5) und der Schriftzug.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Vorschaubild</title>
<style>
  @font-face {
    font-family: "Ubuntu OG";
    font-weight: 400 700;
    src: url("../assets/webfonts/ubuntu-latin-wght.woff2") format("woff2");
  }

  /* Ubuntu Mono liegt nicht im Repo, og-image.js liefert sie unter dieser
     Adresse aus einer Systemdatei aus */
  @font-face {
    font-family: "Ubuntu Mono OG";
    src: url("/ubuntu-mono.ttf");
  }

  html, body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #252a34;
  }

  .og {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  .og > canvas,
  .og > svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .og__abdunkler {
    position: absolute;
    inset: 0;
    background: rgb(0 0 0 / 50%);
  }

  .og__text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
  }

  .og__name {
    margin: 0;
    font-family: "Ubuntu OG", sans-serif;
    font-size: 112px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: #fff;
    text-shadow:
      0 0 6px rgb(5 217 232 / 85%),
      0 0 22px rgb(5 217 232 / 55%),
      0 0 48px rgb(255 0 255 / 35%);
  }

  /* Ubuntu Mono aus fonts-ubuntu 0.869 läuft breiter als die Schrift im
     abgenommenen Entwurf. 28 px ohne Sperrung treffen dessen Zeilenbreite,
     etwas schmaler als der Name. */
  .og__adresse {
    margin: 0;
    font-family: "Ubuntu Mono OG", monospace;
    font-size: 28px;
    color: rgb(255 255 255 / 88%);
  }

  /* ?ohne-text: nur das Motiv, zum Vergleich mit background.jpg */
  .ohne-text .og__abdunkler,
  .ohne-text .og__text {
    display: none;
  }
</style>
</head>
<body>
<div class="og">
  <canvas id="grund"></canvas>
  <svg id="motiv" viewBox="0 0 675 360" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <!-- Sonne: Magenta oben, über Lavendel zu Cyan am Horizont. Werte am
           Rand der Sonne gemessen, die Mitte hellt sonne-glanz auf -->
      <linearGradient id="sonne" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="273">
        <stop offset="0" stop-color="#f216ff"/>
        <stop offset="0.184" stop-color="#f016ff"/>
        <stop offset="0.227" stop-color="#ed19ff"/>
        <stop offset="0.35" stop-color="#c83bff"/>
        <stop offset="0.491" stop-color="#9e61ff"/>
        <stop offset="0.644" stop-color="#708dff"/>
        <stop offset="0.706" stop-color="#5e9eff"/>
        <stop offset="0.859" stop-color="#2dcbff"/>
        <stop offset="0.951" stop-color="#0fe6ff"/>
        <stop offset="1" stop-color="#04f0ff"/>
      </linearGradient>
      <!-- Grüner Glanz in der Mitte der Sonne (additiv, plus-lighter) -->
      <radialGradient id="sonne-glanz" gradientUnits="userSpaceOnUse" cx="337.5" cy="215" r="1"
        gradientTransform="translate(337.5 215) scale(140 86) translate(-337.5 -215)">
        <stop offset="0" stop-color="#003a00"/>
        <stop offset="0.35" stop-color="#002e00"/>
        <stop offset="0.6" stop-color="#001900"/>
        <stop offset="0.8" stop-color="#000900"/>
        <stop offset="1" stop-color="#000"/>
      </radialGradient>
      <!-- Was in den Streifen der Sonne durchscheint: Schein hinter ihr -->
      <linearGradient id="spalt" gradientUnits="userSpaceOnUse" x1="0" y1="118" x2="0" y2="238">
        <stop offset="0" stop-color="#001a48"/>
        <stop offset="0.16" stop-color="#012a64"/>
        <stop offset="0.33" stop-color="#083c8c"/>
        <stop offset="0.5" stop-color="#0b50a4"/>
        <stop offset="0.72" stop-color="#086bb6"/>
        <stop offset="1" stop-color="#0f86c4"/>
      </linearGradient>
      <!-- Linien als Licht: hell unter der Sonne, zum Rand hin Violett, dann dunkel -->
      <linearGradient id="linie" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="675" y2="0">
        <stop offset="0" stop-color="#2e1a2c"/>
        <stop offset="0.1" stop-color="#3a2a48"/>
        <stop offset="0.22" stop-color="#644a80"/>
        <stop offset="0.35" stop-color="#8a88e0"/>
        <stop offset="0.5" stop-color="#70a8dc"/>
        <stop offset="0.65" stop-color="#8a88e0"/>
        <stop offset="0.78" stop-color="#644a80"/>
        <stop offset="0.9" stop-color="#3a2a48"/>
        <stop offset="1" stop-color="#2e1a2c"/>
      </linearGradient>
      <linearGradient id="horizont" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="675" y2="0">
        <stop offset="0" stop-color="#9b3a9e"/>
        <stop offset="0.15" stop-color="#d08fff"/>
        <stop offset="0.3" stop-color="#fffafd"/>
        <stop offset="0.7" stop-color="#fffafd"/>
        <stop offset="0.87" stop-color="#c86cdb"/>
        <stop offset="1" stop-color="#9c3489"/>
      </linearGradient>
      <!-- Himmelsgitter: oben unsichtbar, zum Horizont hin deutlicher -->
      <linearGradient id="himmel-maske-verlauf" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="273">
        <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
        <stop offset="1" stop-color="#fff" stop-opacity="1"/>
      </linearGradient>
      <mask id="himmel-maske" maskUnits="userSpaceOnUse" x="0" y="0" width="675" height="273">
        <rect width="675" height="273" fill="url(#himmel-maske-verlauf)"/>
      </mask>
      <radialGradient id="stern-schein">
        <stop offset="0" stop-color="#e9a6ff" stop-opacity="0.9"/>
        <stop offset="0.4" stop-color="#a64dff" stop-opacity="0.35"/>
        <stop offset="1" stop-color="#7a2cff" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="sonne-form">
        <!-- Kreis um (337,5 | 278,7) mit Radius 168,5, am Horizont abgeschnitten -->
        <path d="M 169.1 273 A 168.5 168.5 0 0 1 505.9 273 Z"/>
      </clipPath>
      <filter id="schein" x="-10%" y="-400%" width="120%" height="900%">
        <feGaussianBlur stdDeviation="1.6"/>
      </filter>
    </defs>
    <g id="himmelsgitter" mask="url(#himmel-maske)" stroke="#a68cf5" stroke-opacity="0.24" stroke-width="1" fill="none"></g>
    <g clip-path="url(#sonne-form)">
      <rect x="160" y="105" width="355" height="170" fill="url(#sonne)"/>
      <rect x="160" y="105" width="355" height="170" fill="url(#sonne-glanz)" style="mix-blend-mode: plus-lighter"/>
      <g id="sonnenstreifen" fill="url(#spalt)"></g>
    </g>
    <g id="sterne"></g>
    <g id="bodengitter" stroke="url(#linie)" fill="none" style="mix-blend-mode: screen"></g>
    <rect x="0" y="272.2" width="675" height="2.4" fill="url(#horizont)" filter="url(#schein)" opacity="0.9"/>
    <rect x="0" y="272.55" width="675" height="1.3" fill="url(#horizont)"/>
  </svg>
  <div class="og__abdunkler"></div>
  <div class="og__text">
    <p class="og__name">Hans Müller</p>
    <p class="og__adresse">grenzenloseschublade.github.io/auflinie</p>
  </div>
</div>
<script>
  'use strict';
  // Maße am Original gemessen (Pixel von background.jpg, 675 × 360)
  const MITTE = 337.5;
  const HORIZONT = 273.2;
  const SONNE = { x: MITTE, y: 278.7, r: 168.5 };
  // Senkrechte Bodenlinien: Abstand zur Mitte am Horizont und Neigung
  // (waagerechter Versatz je Pixel nach unten). Im Himmel laufen sie
  // senkrecht weiter.
  const BODEN_SENKRECHT = [
    [0, 0], [40.2, 0.301], [80.75, 0.6055], [122.1, 0.916], [165.6, 1.18],
    [207.7, 1.554], [254, 1.9], [306.6, 2.3],
  ];
  // Waagerechte Bodenlinien (Mitte der Linie) und ihre Stärke
  const BODEN_WAAGERECHT = [
    [275.0, 0.8], [279.0, 0.9], [283.6, 0.95], [289.0, 1.0], [295.8, 1.05],
    [303.3, 1.1], [312.6, 1.15], [322.0, 1.2], [333.3, 1.3], [345.4, 1.4],
    [359.4, 1.5],
  ];
  const HIMMEL_WAAGERECHT = [33, 73.5, 113.7, 153.8, 194.3, 235.5];
  // Dunkle Streifen der Sonne: Ober- und Unterkante
  const SONNENSTREIFEN = [
    [119.8, 121.6], [135.8, 137.8], [156.2, 158.6], [177.2, 179.8],
    [202.4, 205.2], [234.8, 237.4],
  ];
  // Sterne: x, y, Helligkeit 0–1, Farbe des Kerns (aus dem Original gelesen)
  const STERNE = [
    [398.1, 10.4, 0.19, '#300bd4'], [323.3, 22.3, 0.23, '#3514dd'], [191.0, 44.6, 0.44, '#9534e6'],
    [638.4, 44.1, 0.12, '#450e8e'], [421.6, 48.4, 0.45, '#7242f6'], [352.3, 66.3, 0.37, '#47527f'],
    [509.4, 67.3, 0.64, '#bf65ff'], [125.6, 69.7, 0.15, '#5b16ad'], [281.6, 71.8, 0.55, '#7665ff'],
    [326.6, 78.6, 0.52, '#6964fe'], [267.6, 78.9, 0.29, '#3d4979'], [306.5, 78.9, 0.29, '#424673'],
    [137.3, 85.5, 0.09, '#4e187a'], [182.3, 91.7, 0.13, '#441aa0'], [565.3, 100.3, 0.75, '#ec80ff'],
    [465.9, 104.2, 0.24, '#424276'], [23.8, 109.6, 0.13, '#722491'], [183.3, 120.6, 1.00, '#ffd5fb'],
    [225.7, 120.8, 0.13, '#3d289d'], [263.1, 122.9, 0.11, '#262da1'], [209.8, 128.6, 0.63, '#71a8de'],
    [440.9, 129.2, 0.12, '#3229b8'], [529.0, 130.3, 0.15, '#4c25b4'], [193.6, 133.0, 0.12, '#442f74'],
    [196.8, 132.5, 0.51, '#8084c1'], [244.5, 132.9, 0.09, '#28377c'], [620.6, 132.9, 0.19, '#702aa7'],
    [505.1, 141.7, 0.12, '#44299a'], [495.3, 147.6, 0.74, '#84c3f6'], [550.3, 150.7, 0.16, '#5c2fae'],
    [157.8, 165.0, 0.19, '#6c3abf'], [509.4, 166.9, 0.89, '#e4cdff'], [110.6, 168.6, 0.11, '#6e2e9c'],
    [88.8, 171.2, 0.84, '#ffceef'], [557.9, 171.5, 0.86, '#f4bfff'], [516.9, 175.5, 0.48, '#6992ca'],
    [650.9, 174.9, 0.22, '#922dc9'], [495.1, 184.5, 0.38, '#647fce'], [579.1, 184.9, 0.16, '#6835ae'],
    [608.7, 186.8, 0.12, '#682fa2'], [125.4, 191.3, 0.23, '#9541df'], [93.6, 201.9, 0.27, '#b642e3'],
    [534.6, 204.7, 0.95, '#fce4ff'], [615.5, 209.2, 0.88, '#ffd4ff'], [165.2, 210.5, 0.19, '#7548d6'],
    [173.8, 211.5, 0.09, '#5447a3'], [118.0, 226.9, 0.14, '#8040b8'], [53.2, 228.3, 0.12, '#9d3cad'],
    [89.2, 228.8, 0.16, '#9642bc'], [68.6, 232.7, 0.28, '#c850e3'], [525.2, 238.1, 0.19, '#7347d8'],
    [52.5, 247.1, 0.83, '#f1edea'], [602.1, 250.4, 0.87, '#ffd2ff'], [117.6, 252.3, 0.91, '#fffcfd'],
    [585.0, 252.6, 0.25, '#8d44d3'], [550.5, 262.0, 0.15, '#5f3fae'],
  ];

  const SVG_NS = 'http://www.w3.org/2000/svg';
  function el(name, attrs, parent) {
    const node = document.createElementNS(SVG_NS, name);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
    parent.appendChild(node);
    return node;
  }

  function zeichneMotiv() {
    const himmel = document.getElementById('himmelsgitter');
    for (const [d] of BODEN_SENKRECHT) {
      for (const x of d === 0 ? [MITTE] : [MITTE - d, MITTE + d]) {
        el('line', { x1: x, y1: 0, x2: x, y2: HORIZONT }, himmel);
      }
    }
    for (const y of HIMMEL_WAAGERECHT) el('line', { x1: 0, y1: y, x2: 675, y2: y }, himmel);

    const streifen = document.getElementById('sonnenstreifen');
    for (const [oben, unten] of SONNENSTREIFEN) {
      el('rect', { x: 160, y: oben, width: 355, height: unten - oben }, streifen);
    }

    const sterne = document.getElementById('sterne');
    for (const [x, y, h, farbe] of STERNE) {
      el('circle', { cx: x, cy: y, r: 1.2 + 2.8 * h, fill: 'url(#stern-schein)', opacity: Math.min(1, 0.25 + h) }, sterne);
      el('circle', { cx: x, cy: y, r: 0.45 + 0.6 * h, fill: farbe, opacity: Math.min(1, 0.55 + h) }, sterne);
    }

    const boden = document.getElementById('bodengitter');
    const unten = 362;
    for (const [d, neigung] of BODEN_SENKRECHT) {
      for (const s of d === 0 ? [1] : [-1, 1]) {
        el('line', {
          x1: MITTE + s * d, y1: HORIZONT,
          x2: MITTE + s * (d + neigung * (unten - HORIZONT)), y2: unten,
          'stroke-width': 1.1,
        }, boden);
      }
    }
    for (const [y, staerke] of BODEN_WAAGERECHT) {
      el('line', { x1: 0, y1: y, x2: 675, y2: y, 'stroke-width': staerke }, boden);
    }
  }

  // Median je Farbkanal über ein Quadrat mit Radius r
  function median(daten, breite, hoehe, r) {
    const aus = new Uint8ClampedArray(daten.length);
    const werte = [[], [], []];
    for (let y = 0; y < hoehe; y++) {
      for (let x = 0; x < breite; x++) {
        werte[0].length = 0; werte[1].length = 0; werte[2].length = 0;
        for (let dy = -r; dy <= r; dy++) {
          const yy = Math.min(hoehe - 1, Math.max(0, y + dy));
          for (let dx = -r; dx <= r; dx++) {
            const xx = Math.min(breite - 1, Math.max(0, x + dx));
            const i = (yy * breite + xx) * 4;
            werte[0].push(daten[i]); werte[1].push(daten[i + 1]); werte[2].push(daten[i + 2]);
          }
        }
        const o = (y * breite + x) * 4;
        for (let k = 0; k < 3; k++) {
          werte[k].sort((a, b) => a - b);
          aus[o + k] = werte[k][werte[k].length >> 1];
        }
        aus[o + 3] = 255;
      }
    }
    return aus;
  }

  // Die Sonne aus dem Grund nehmen, sonst trägt der Filter ihre Farbe als
  // Saum über den scharfen Rand hinaus. Jedes Pixel der Sonne (samt
  // Kante) übernimmt den Himmel knapp außerhalb auf demselben Strahl.
  function sonneAusblenden(daten, breite) {
    const rand = SONNE.r + 4;
    for (let y = 0; y < Math.floor(HORIZONT); y++) {
      for (let x = 0; x < breite; x++) {
        const dx = x + 0.5 - SONNE.x;
        const dy = y + 0.5 - SONNE.y;
        const d = Math.hypot(dx, dy);
        if (d >= SONNE.r + 2) continue;
        const qx = Math.round(SONNE.x + (dx / d) * rand - 0.5);
        const qy = Math.min(Math.floor(HORIZONT) - 2, Math.round(SONNE.y + (dy / d) * rand - 0.5));
        const i = (y * breite + x) * 4;
        const q = (qy * breite + qx) * 4;
        daten[i] = daten[q]; daten[i + 1] = daten[q + 1]; daten[i + 2] = daten[q + 2];
      }
    }
  }

  // Kastenfilter mit Radius r, Ränder fortgesetzt (kein dunkler Saum)
  function glaetten(daten, breite, hoehe, r) {
    const aus = new Uint8ClampedArray(daten.length);
    const n = (2 * r + 1) * (2 * r + 1);
    for (let y = 0; y < hoehe; y++) {
      for (let x = 0; x < breite; x++) {
        const summe = [0, 0, 0];
        for (let dy = -r; dy <= r; dy++) {
          const yy = Math.min(hoehe - 1, Math.max(0, y + dy));
          for (let dx = -r; dx <= r; dx++) {
            const xx = Math.min(breite - 1, Math.max(0, x + dx));
            const i = (yy * breite + xx) * 4;
            summe[0] += daten[i]; summe[1] += daten[i + 1]; summe[2] += daten[i + 2];
          }
        }
        const o = (y * breite + x) * 4;
        aus[o] = summe[0] / n; aus[o + 1] = summe[1] / n; aus[o + 2] = summe[2] / n;
        aus[o + 3] = 255;
      }
    }
    return aus;
  }

  async function zeichneGrund() {
    const bild = new Image();
    bild.src = '../assets/images/background.jpg';
    await bild.decode();
    const w = bild.naturalWidth;
    const h = bild.naturalHeight;
    const quelle = document.createElement('canvas');
    quelle.width = w;
    quelle.height = h;
    const qc = quelle.getContext('2d');
    qc.drawImage(bild, 0, 0);
    const daten = qc.getImageData(0, 0, w, h);
    sonneAusblenden(daten.data, w);
    let gefiltert = median(daten.data, w, h, 4);
    gefiltert = glaetten(glaetten(gefiltert, w, h, 1), w, h, 1);
    daten.data.set(gefiltert);
    qc.putImageData(daten, 0, 0);

    const ziel = document.getElementById('grund');
    ziel.width = window.innerWidth;
    ziel.height = window.innerHeight;
    const zc = ziel.getContext('2d');
    // wie background-size: cover, mittig
    const massstab = Math.max(ziel.width / w, ziel.height / h);
    const bw = w * massstab;
    const bh = h * massstab;
    zc.imageSmoothingEnabled = true;
    zc.imageSmoothingQuality = 'high';
    zc.drawImage(quelle, (ziel.width - bw) / 2, (ziel.height - bh) / 2, bw, bh);
  }

  if (new URLSearchParams(location.search).has('ohne-text')) {
    document.documentElement.classList.add('ohne-text');
  }
  zeichneMotiv();
  window.ogFertig = Promise.all([zeichneGrund(), document.fonts.load('700 112px "Ubuntu OG"'), document.fonts.load('28px "Ubuntu Mono OG"'), document.fonts.ready]);
</script>
</body>
</html>
