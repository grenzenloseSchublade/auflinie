- section: "Profil"
  icon: "user"
  # Einleitung ohne Überschrift (site-weites Muster: Hero → Intro-Text → H2-Abschnitte)
  intro: true

  content: >-

        Ingenieur mit Schwerpunkt **Machine Learning** — an der Ruhr-Universität Bochum habe ich **Elektro- und Informationstechnik** (M.Sc., *Eingebettete Systeme*) studiert.
        Seit nunmehr vielen Jahren entwickle ich KI-Software von der ersten Idee bis in den produktiven Betrieb: das Problem mit den Menschen klären, die es haben, Prototypen bauen, Modelle entwickeln und optimieren, deployen.
        <br> <br>
        Gearbeitet habe ich in Forschung wie Industrie, in Teams unterschiedlicher Größe; über die Jahre ist so das komplette **Full-Stack**-Handwerk dazugekommen — Frontend, Backend, DevOps und MLOps.
        Zwischen dem, was ein Modell auf dem Testset kann, und dem, was es im Alltag leistet, liegt der Teil der Arbeit, der mich interessiert.


