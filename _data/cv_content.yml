- section: "Profil"
  icon: "user"
  # Einleitung ohne Überschrift (site-weites Muster: Hero → Intro-Text → H2-Abschnitte)
  intro: true

  content: |-
        Ich bin Ingenieur mit Schwerpunkt **Machine Learning** und habe **Elektro- und Informationstechnik** an der Ruhr-Universität Bochum studiert (M. Sc., *Eingebettete Systeme*).
        Seit vielen Jahren baue ich KI-Software, von der ersten Idee bis in den laufenden Betrieb. Am Anfang steht dabei immer die gleiche Frage: Welches Problem haben die Menschen eigentlich, für die das Ganze gedacht ist?\\
        \\
        Gearbeitet habe ich in Forschung und Industrie, in Teams jeder Größe. So ist nach und nach das **Full-Stack**-Handwerk dazugekommen, von Frontend über DevOps bis MLOps. Am wohlsten fühle ich mich aber im **Backend**.
        Was mich reizt, ist der Weg – man startet mit einer Idee und einer Problembeschreibung, arbeitet sich durch komplexe Algorithmen und kommt am Ende zu einer Lösung, die Prozesse ganz oder teilweise automatisiert oder den Alltag spürbar vereinfacht.


