- section: "Profil"
  icon: "user"
  # Einleitung ohne Überschrift (site-weites Muster: Hero → Intro-Text → H2-Abschnitte)
  intro: true

  content: >-

        Ingenieur mit Schwerpunkt **Machine Learning**, ausgebildet in **Elektro- und Informationstechnik** an der Ruhr-Universität Bochum (M.Sc., *Eingebettete Systeme*).
        Seit vielen Jahren baue ich KI-Software, von der ersten Idee bis in den laufenden Betrieb. Am Anfang steht dabei immer die gleiche Frage: Welches Problem haben die Menschen eigentlich, für die das Ganze gedacht ist?
        <br> <br>
        Gearbeitet habe ich in Forschung und Industrie, in Teams jeder Größe. So ist nach und nach das ganze **Full-Stack**-Handwerk dazugekommen — Frontend, Backend, DevOps und MLOps.
        Am meisten fasziniert mich der Weg — man startet mit einer Idee und einer Problembeschreibung, arbeitet sich durch komplexe Algorithmik und am Ende kommt man zu einer Lösung, die Prozesse oder den Alltag spürbar vereinfacht und (teil-)automatisiert.


