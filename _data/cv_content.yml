- section: "Profil"
  icon: "user"
  # Einleitung ohne Überschrift (site-weites Muster: Hero → Intro-Text → H2-Abschnitte)
  intro: true

  content: >-

        Ingenieur mit Schwerpunkt **Machine Learning** — an der Ruhr-Universität Bochum habe ich **Elektro- und Informationstechnik** (M.Sc., *Eingebettete Systeme*) studiert.
        Seit sechs Jahren entwickle ich KI-Softwarelösungen von der ersten Idee bis in die Produktivumgebung: Prototypen bauen, Anforderungen mit Stakeholdern schärfen, Modelle entwickeln und optimieren, deployen.
        <br> <br>
        Gearbeitet habe ich dabei in Forschung wie Industrie und in Teams unterschiedlicher Größe; über die Jahre ist so das komplette **Full-Stack**-Handwerk dazugekommen — Frontend, Backend, DevOps und MLOps.
        Was mich am meisten reizt: komplexe theoretische Probleme in Lösungen zu übersetzen, die im Alltag funktionieren.


