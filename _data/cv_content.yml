- section: "Profil"
  icon: "user"
  # Einleitung ohne Überschrift (site-weites Muster: Hero → Intro-Text → H2-Abschnitte)
  intro: true

  content: |-
        Ich bin **Applied AI Engineer** und **Ingenieur** der Elektro- und Informationstechnik (**M. Sc.**, Ruhr-Universität Bochum, *Eingebettete Systeme*).
        Im Mittelpunkt stehen seit vielen Jahren KI-Systeme, von der Analyse des Fachproblems über Architektur und Prototyp bis zur Integration in bestehende Abläufe. Ausgangspunkt sind immer die Menschen, die später damit arbeiten, und das Problem, das sie wirklich haben.\\
        \\
        Die Arbeit reicht von klassischer Bildverarbeitung und selbst trainierten Deep-Learning-Modellen für Bild und Sprache bis zu **Large Language Models** und Wissensgraphen, in der Forschung wie in der Industrie. Nach und nach ist das Full-Stack-Handwerk dazugekommen, vom Frontend bis zu DevOps. Der Schwerpunkt liegt im Backend und zunehmend in der **Architektur** von KI-Lösungen.
        Aktuell geht es vor allem um Gesetze und Regelwerke, aus denen mit KI prüfbare Daten werden. Mich reizt jedes Mal der Weg von der ersten Idee bis zu einer Lösung, die Prozesse ganz oder teilweise automatisiert oder den Alltag spürbar vereinfacht.


