- section: "Profil"
  icon: "user"
  # Einleitung ohne Überschrift (site-weites Muster: Hero → Intro-Text → H2-Abschnitte)
  intro: true

  content: |-
        **(Applied) AI Engineer** und **Ingenieur** der Elektro- und Informationstechnik (**M. Sc.**, Ruhr-Universität Bochum, *Eingebettete Systeme*).
        Im Mittelpunkt stehen seit vielen Jahren KI-Systeme, von der Analyse des Fachproblems über Architektur und Prototyp bis zur Integration in bestehende Abläufe. Am Anfang steht dabei immer die gleiche Frage: Welches Problem haben die Menschen eigentlich, für die das Ganze gedacht ist?\\
        \\
        Die Arbeit reicht von klassischer Bildverarbeitung und selbst trainierten Deep-Learning-Modellen für Bild und Sprache bis zu **Large Language Models** und Wissensgraphen, in Forschung und Industrie und in Teams jeder Größe. Nach und nach ist das **Full-Stack**-Handwerk dazugekommen, vom Frontend über DevOps bis MLOps. Der Schwerpunkt liegt im **Backend** und zunehmend in der **Architektur** von KI-Lösungen.
        Aktuell geht es vor allem um Gesetze und Regelwerke, aus denen mit KI prüfbare Daten werden. Reizvoll ist dabei jedes Mal der Weg – am Anfang stehen eine Idee und eine Problembeschreibung, dazwischen komplexe Algorithmen, und am Ende eine Lösung, die Prozesse ganz oder teilweise automatisiert oder den Alltag spürbar vereinfacht.


