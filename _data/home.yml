# Markup steht in _includes/home/. Mehrere Absätze im |-Block mit einer
# Leerzeile trennen, Markdown ist erlaubt (Betonung, Links).

# Einleitung direkt unter dem Hero, ohne Überschrift (SEITE-1)
intro: |-
  Theorie hat ihren eigenen Reiz. Man kann sich in ihr verlieren, und manchmal ist das genau richtig: In der Philosophie ist der Gedanke selbst das Werk, und ohne Grundlagenforschung gäbe es nichts, was sich anwenden ließe. Am schönsten ist der Moment, in dem etwas genau so funktioniert, wie es erdacht war.

  Spannend wird es dort, wo Ideen auf die Wirklichkeit treffen. Die Praxis bestätigt die Theorie nicht nur – sie zeigt oft Wege, die keine Herleitung vorhergesehen hat. Als Ingenieur arbeite ich seit vielen Jahren genau an dieser Stelle, aktuell an KI, die Wissen aus Dokumenten erschließt.

  Erfahrung nützt aber wenig, solange sie bei einem selbst bleibt. Wissen wird nicht weniger, wenn man es teilt, sondern wertvoller, je mehr Menschen es erreicht. Deshalb steht hier, was ich gebaut und verstanden habe.

# Kachel zur Fraktal-Seite (_includes/home/fractal-showcase.html)
fractal_showcase:
  title: "Die Mandelbrot-Menge, interaktiv"
  text: "Unendliche Komplexität aus einer einfachen Formel. Der Mandelbrot-Julia-Explorer zeichnet die Mandelbrot-Menge und die zugehörigen Julia-Mengen direkt im Browser – hineinzoomen, Parameter verändern und die Strukturen entdecken, die dabei sichtbar werden."
  button: "Fraktale erkunden"
  url: "/mandelbrot/"
  link_label: "Fraktale interaktiv erkunden" # Name des Bildlinks für Screenreader
  image:
    src: "/assets/images/mandelbrot-preview-800.jpg"
    alt: "Ausschnitt der Mandelbrot-Menge mit spiralförmigen Ausläufern"
    width: 800 # Pixelmaße der Datei unter src (IMG-3)
    height: 450
    # Weitere Breiten desselben Bildes (IMG-4), der Browser wählt passend zur
    # Anzeige. Neue Datei hier und in CACHE_URLS (service-worker.js) eintragen.
    # Vorlage in voller Größe: mandelbrot-preview.jpg (1920 × 1080)
    srcset:
      - src: "/assets/images/mandelbrot-preview-400.jpg"
        width: 400
      - src: "/assets/images/mandelbrot-preview-800.jpg"
        width: 800

