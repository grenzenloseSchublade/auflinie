# =============================================================================
# Skill-Graph-Daten (Single Source of Truth für das interaktive Skill-Feature)
# =============================================================================
# Schema v1:
#   version:     Schema-Version (Pflicht; das JS prüft sie und degradiert stumm)
#   foundations: Basis-Skills (generische Dev-Infra), die in fast jedem Projekt
#                stecken. BEWUSST ohne Projektkanten – sonst werden sie zu Hubs
#                und ein Klick leuchtet den halben Graphen an. Das JS zeigt beim
#                Klick eine eigene "Basis-Werkzeug"-Meldung statt einer Projektliste.
#   projects:    Liste der Projekte, die (Signature-)Skills verbinden
#     id:        stabiler kebab-case-Schlüssel (Pflicht, nie umbenennen)
#     label:     Anzeigename für die Kontextzeile (Pflicht)
#     skills:    Liste von Skill-IDs – nur die PROJEKT-DEFINIERENDEN Skills
#                (Signature), nicht jede Nutzung; Basis-Skills gehören hier NICHT rein.
#
# Skill-IDs = slugify(Chip-Name) aus cv_content.yml → skill_groups (core + breadth),
#   z. B.: "Computer Vision" → computer-vision, "OCR / Tesseract" → ocr-tesseract,
#   "HTML5 / CSS3" → html5-css3, "C#" → c, ".NET" → net.
# Das JS warnt in der Konsole, wenn eine ID keinen Chip im DOM trifft.
#
# Kanten Skill↔Skill entstehen im JS implizit über gemeinsame Projekte (Gewicht
# = Anzahl) – hier bewusst KEINE redundanten Kantenlisten pflegen.
#
#   texts:       Bedientexte des Skill-Features (ganz unten, STYLEGUIDE ARCH-4)
# =============================================================================
version: 1

# Generische Dev-Infra: als Chips sichtbar, im Graphen kantenlos.
foundations: [git, docker, bash-linux, ci-cd, dev-container, vs-code, pip]

projects:
  # Reihenfolge wie im Lebenslauf, neueste zuerst. Labels erscheinen in der
  # Auswahl-Konsole: öffentlich und anonym, keine Kunden- oder internen Namen.
  # Nur Chips, die es in cv_content.yml gibt. Was fehlt (Django, Kubernetes,
  # C / C++ …), kommt erst mit der Neugruppierung der Skills dazu.
  - id: erfahrungswissen
    label: "Erfahrungswissen (KI-Lösung)"
    skills: [python, llms, generative-ai]

  - id: regelabgleich-finanz
    label: "Regelabgleich Finanzbranche"
    skills: [python, llms, generative-ai, neo4j]

  - id: plattform-anwendungsfaelle
    label: "Abdeckungsprüfung und EU-Recht"
    skills: [python, llms, generative-ai, prompt-engineering, nlp, neo4j, dagster, azure]

  - id: regelwerk-plattform
    label: "KI-Plattform für Regelwerke"
    skills: [python, llms, generative-ai, nlp, neo4j, dagster, data-engineering, azure, docker-compose]

  - id: formularwesen
    label: "Gesetze im Formularwesen"
    skills: [python, dagster, data-engineering, neo4j, hugging-face, gitlab-ci-cd, azure]

  - id: modellvergleich
    label: "Benchmarking Sprachmodelle"
    skills: [python, llms, nlp, hugging-face, spacy, numpy-scikit-learn, dvc]

  - id: vue-webapp
    label: "Weboberfläche Pflegedoku"
    skills: [vue-js, typescript, rest, vite, pinia, scss, html5-css3, responsive-design]

  - id: doku-system
    label: "Dokumentationsassistent"
    skills: [python, llms, generative-ai, fastapi, rest, sql, tdd, github-actions, scrum-kanban]

  - id: tts-nlp
    label: "Sprachsynthese"
    skills: [python, tensorflow, neural-networks, remote-computing-gpu-training, hyperparameter-tuning, cloud-computing-fundamentals]

  - id: telematik
    label: "Telematik-Nachbildung"
    skills: [spring-boot, kotlin, rest, microservices]

  - id: belegerkennung
    label: "Texterkennung Kassenrezepte"
    skills: [python, tensorflow, neural-networks, computer-vision, opencv, ocr-tesseract, numpy-scikit-learn, rabbitmq-message-queues]

  # Das Bildverarbeitungsverfahren ist C / C++ (dafür gibt es noch keinen
  # Chip). „c“ ist der Slug von „C#“ und steht für die App mit Xamarin / .NET.
  - id: belege-app
    label: "Mobile Belegerfassung"
    skills: [computer-vision, opencv, xamarin, c, net]

  - id: technologie-evaluierung
    label: "Technologie-Evaluierungen"
    skills: [gpt-3, prompt-engineering, python]

  - id: website
    label: "diese Website"
    skills: [javascript, scss, html5-css3, responsive-design]

# =============================================================================
# Texte des Skill-Features: Hinweiszeile über den Chips, Knopf und Fenster des
# Skill-Graphen. Nur hier pflegen, Markup (_includes/cv/skills.html,
# _includes/cv/skill-graph.html) und Skripte (assets/js/skill-*.js) lesen sie
# von hier. Reiner Text, kein Markdown und kein HTML.
# „label“ ist der Name für Screenreader und beginnt mit dem sichtbaren Text,
# „title“ der Tooltip beim Überfahren mit der Maus.
# Der ganze Block geht mit den Projekten als Datenblock an den Browser, auch
# die Texte, die schon im Markup stehen (gut 1 KB, bewusst eine Quelle).
# Fehlt ein Schlüssel oder ist er leer, meldet das der Inhalts-Check
# (scripts/content-check.py).
# =============================================================================
texts:
  # Hinweis über den Chips und im Graph-Fenster, solange nichts gewählt ist
  hint: "Ein Skill zeigt bei Auswahl verwandte Skills und gemeinsame Projekte."

  # Name der Liste „Breite“ jeder Skill-Gruppe für Screenreader, dahinter
  # folgt der Name der Gruppe
  breadth: "Ergänzende Kenntnisse in"

  # Nach einem Klick steht dort „Skill – Text“, bei Projekten darunter die Liste
  selection:
    with_projects: "gemeinsam im Einsatz bei"
    foundation: "Basiswerkzeug, quer durch fast alle Projekte im Einsatz."
    no_projects: "Teil des Werkzeugkastens, keinem Projekt fest zugeordnet."

  graph:
    open: "Skill-Graph öffnen" # Knopf über den Skill-Gruppen
    # Kleiner Knopf rechts in der Auswahl-Konsole, erscheint beim Scrollen,
    # sobald der große Knopf aus dem Bild ist. Er zeigt nur ein Wort, sein
    # label beginnt deshalb damit.
    open_short:
      text: "Graph"
      label: "Graph – Skill-Graph öffnen"
      title: "Skill-Graph öffnen"
    lead: "Welche Fähigkeiten in welchen Projekten zusammenkommen" # Zeile neben dem Knopf
    dialog: "Skill-Graph" # Name des geöffneten Fensters für Screenreader
    close: "Graph schließen" # Name des ✕-Knopfs für Screenreader
    # Zweite Zeile der Info-Leiste im Graph-Fenster, solange nichts gewählt ist
    unlabeled: "Punkte ohne Namen zeigen ihn bei Auswahl oder beim Hineinzoomen."
    # Beschreibung der Grafik für Screenreader
    canvas: "Netzwerkdiagramm der Skills, verbunden über gemeinsame Projekte. Auswahl und gemeinsame Projekte stehen in der Leiste darüber, die vollständige Liste im Lebenslauf."
    # Knöpfe oben im Fenster. Die Zoom-Knöpfe zeigen nur das Zeichen − bzw. +,
    # ihr label beginnt deshalb damit.
    zoom_out:
      label: "− Verkleinern"
      title: "Verkleinern"
    zoom_in:
      label: "+ Vergrößern"
      title: "Vergrößern"
    # Führt zur Startansicht wie beim Öffnen, ausgegraut, solange sie steht
    fit:
      text: "Übersicht"
      label: "Übersicht – zur Startansicht"
      title: "Übersicht"
    reset:
      text: "Reset"
      label: "Reset – Ansicht zurücksetzen"
      title: "Zurücksetzen"
    # Kurzer Hinweis beim ersten Öffnen auf Touch-Geräten, eine Zeile je Geste
    touch_hint:
      - "↔ Ziehen verschiebt die Ansicht"
      - "± Zwei Finger zoomen"
      - "● Knoten: ziehen ordnet um, tippen wählt aus"
