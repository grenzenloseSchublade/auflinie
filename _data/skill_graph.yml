# =============================================================================
# Skill-Graph-Daten (Single Source of Truth für das interaktive Skill-Feature)
# =============================================================================
# Schema v1:
#   version:     Schema-Version (Pflicht; das JS prüft sie und degradiert stumm)
#   foundations: Basis-Skills (generische Dev-Infra), die in fast jedem Projekt
#                stecken. BEWUSST ohne Projektkanten – sonst werden sie zu Hubs
#                und ein Klick leuchtet den halben Graphen an. Das JS zeigt beim
#                Klick eine eigene "Basis-Werkzeug"-Meldung statt einer Projektliste.
#   projects:    Liste der Projekte, die (Signature-)Skills verbinden
#     id:        stabiler kebab-case-Schlüssel (Pflicht, nie umbenennen)
#     label:     Anzeigename für die Kontextzeile (Pflicht)
#     short:     Kurzname im Graphen mit Projekt-Knoten (optional, nur wenn
#                label dort zu lang ist; die Info-Leiste nennt label)
#     skills:    Liste von Skill-IDs – nur die PROJEKT-DEFINIERENDEN Skills
#                (Signature), nicht jede Nutzung; Basis-Skills gehören hier NICHT rein.
#
# Skill-IDs = slugify(Chip-Name) aus cv_content.yml → skill_groups (core + breadth),
#   z. B.: "Computer Vision" → computer-vision, "OCR / Tesseract" → ocr-tesseract,
#   "HTML5 / CSS3" → html5-css3, "C#" → c, ".NET" → net.
# Das JS warnt in der Konsole, wenn eine ID keinen Chip im DOM trifft.
#
# Kanten entstehen im JS implizit aus projects – hier bewusst KEINE
# redundanten Kantenlisten pflegen. Wie, entscheidet graph_mode:
#   graph_mode:  projekte  Projekte sind eigene Knoten, Kanten Skill↔Projekt
#                          (Stufe 2, Prototyp)
#                skills    nur Skill-Knoten, Kanten Skill↔Skill über
#                          gemeinsame Projekte (Gewicht = Anzahl, Stufe 1)
#                Die Chip-Liste ist in beiden Fassungen gleich.
#
#   texts:       Bedientexte des Skill-Features (ganz unten, STYLEGUIDE ARCH-4)
# =============================================================================
version: 1

# Fassung des Skill-Graphen (siehe oben): projekte | skills
graph_mode: projekte

# Generische Dev-Infra: als Chips sichtbar, im Graphen kantenlos.
foundations: [git, docker, bash-linux, ci-cd, devcontainer, vs-code, pip]

projects:
  - id: doku-system
    label: "Doku-System (Spracherkennung)"
    short: "Doku-System"
    skills: [python, tensorflow, neural-networks, llms, nlp, fastapi, sql, rest]

  - id: belegerkennung
    label: "Belegerkennung"
    skills: [python, tensorflow, computer-vision, opencv, ocr-tesseract, numpy-scikit-learn]

  - id: telematik
    label: "Telematik-System"
    skills: [springboot, kotlin, rest, sql, microservices]

  - id: tts-nlp
    label: "TTS- / NLP-Forschung"
    skills: [python, tensorflow, neural-networks, nlp, remote-computing-gpu-training, hyperparameter-tuning]

  - id: vue-webapp
    label: "Vue-Webanwendung"
    skills: [vue, typescript, javascript, rest, keycloak, vite, pinia, scss, responsive-design]

  - id: modellvergleich
    label: "Modellvergleichs-Tool"
    skills: [python, llms, hugging-face, spacy, numpy-scikit-learn, dvc]

  - id: belege-app
    label: "Belege-App"
    skills: [opencv, computer-vision, xamarin, c]

  - id: genai-beratung
    label: "GenAI-Beratung"
    skills: [python, llms, generative-ai, prompt-engineering, neo4j, azure, dagster, rest]

  - id: website
    label: "diese Website"
    skills: [javascript, scss, html5-css3, responsive-design]

# =============================================================================
# Texte des Skill-Features: Hinweiszeile über den Chips, Knopf und Fenster des
# Skill-Graphen. Nur hier pflegen, Markup (_includes/cv/skills.html,
# _includes/cv/skill-graph.html) und Skripte (assets/js/skill-*.js) lesen sie
# von hier. Reiner Text, kein Markdown und kein HTML.
# „label“ ist der Name für Screenreader und beginnt mit dem sichtbaren Text,
# „title“ der Tooltip beim Überfahren mit der Maus.
# Der ganze Block geht mit den Projekten als Datenblock an den Browser, auch
# die Texte, die schon im Markup stehen (gut 1 KB, bewusst eine Quelle).
# Fehlt ein Schlüssel oder ist er leer, meldet das der Inhalts-Check
# (scripts/content-check.py).
# =============================================================================
texts:
  # Hinweis über den Chips und im Graph-Fenster, solange nichts gewählt ist
  hint: "Ein Klick auf einen Skill zeigt verwandte Skills und gemeinsame Projekte."

  # Name der Liste „Breite“ jeder Skill-Gruppe für Screenreader, dahinter
  # folgt der Name der Gruppe
  breadth: "Ergänzende Kenntnisse in"

  # Nach einem Klick steht dort „Skill – Text“, bei Projekten darunter die Liste
  selection:
    with_projects: "gemeinsam im Einsatz bei"
    foundation: "Basis-Werkzeug, quer durch fast alle Projekte im Einsatz."
    no_projects: "Teil des Werkzeugkastens, ohne feste Projektzuordnung."
    # Nur im Graphen mit Projekt-Knoten: „Projekt – Text“, darunter die Skills
    project: "hier kamen zusammen"

  graph:
    open: "Skill-Graph öffnen" # Knopf über den Skill-Gruppen
    lead: "Welche Fähigkeiten in welchen Projekten zusammenkommen" # Zeile neben dem Knopf
    dialog: "Skill-Graph" # Name des geöffneten Fensters für Screenreader
    close: "Graph schließen" # Name des ✕-Knopfs für Screenreader
    # Zweite Zeile der Info-Leiste im Graph-Fenster, solange nichts gewählt ist
    unlabeled: "Punkte ohne Namen zeigen ihn bei Auswahl oder beim Hineinzoomen."
    # Beschreibung der Grafik für Screenreader
    canvas: "Netzdiagramm der Skills, verbunden über gemeinsame Projekte. Auswahl und gemeinsame Projekte stehen in der Leiste darüber, die vollständige Liste im Lebenslauf."
    # Fassung mit Projekt-Knoten (graph_mode: projekte): Hinweis in der
    # Info-Leiste, solange nichts gewählt ist, und Beschreibung der Grafik.
    # Der Hinweis über den Chips bleibt hint (oben).
    projekte:
      hint: "Ein Klick auf ein Projekt zeigt seine Skills, auf einen Skill seine Projekte."
      canvas: "Netzdiagramm der Projekte und Skills. Jedes Projekt ist mit den Skills verbunden, die darin zusammenkamen. Auswahl und Verbindungen stehen in der Leiste darüber, die vollständige Liste im Lebenslauf."
    # Knöpfe oben im Fenster. Die Zoom-Knöpfe zeigen nur das Zeichen − bzw. +,
    # ihr label beginnt deshalb damit.
    zoom_out:
      label: "− Verkleinern"
      title: "Verkleinern"
    zoom_in:
      label: "+ Vergrößern"
      title: "Vergrößern"
    # Führt zur Startansicht wie beim Öffnen, ausgegraut, solange sie steht
    fit:
      text: "Übersicht"
      label: "Übersicht – zur Startansicht"
      title: "Übersicht"
    reset:
      text: "Reset"
      label: "Reset – Ansicht zurücksetzen"
      title: "Zurücksetzen"
    # Kurzer Hinweis beim ersten Öffnen auf Touch-Geräten, eine Zeile je Geste
    touch_hint:
      - "↔ Ziehen verschiebt die Ansicht"
      - "± Zwei Finger zoomen"
      - "● Knoten: ziehen ordnet um, tippen wählt aus"
