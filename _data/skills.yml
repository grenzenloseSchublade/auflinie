    title: "LLMs & Wissensgraphen"
    context: "Wissen aus Dokumenten erschließen – mit Sprachmodellen, Retrieval und Wissensgraphen, samt Bewertung der Antworten"
  - id: ml
    title: "Machine Learning, Bild & Sprache"
    context: "Eigene Modelle trainieren und anpassen – für Belege, Bilder und gesprochene Sprache"
  - id: daten-backend
    title: "Daten & Backend"
    context: "Pipelines und Schnittstellen, die Dokumente einlesen, Daten aufbereiten und Ergebnisse bereitstellen"
  - id: cloud-devops
    title: "Cloud & DevOps"
    context: "Reproduzierbare Umgebungen, automatisierte Pipelines und der Weg in den Betrieb"
  - id: frontend
    title: "Frontend & Mobile"
