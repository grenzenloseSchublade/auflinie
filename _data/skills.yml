# =============================================================================
# Skill-Katalog: EINE Quelle für die Skill-Chips im Lebenslauf, den
# Skill-Graphen und die Bedientexte des Skill-Features
# =============================================================================
# Aufbau (Schema-Version für den Browser siehe version):
#   groups:      Themen-Gruppen, Reihenfolge = Reihenfolge auf der Seite.
#                id (stabil), title (Überschrift), context (eine Zeile: wofür).
#                Eine Gruppe ohne sichtbare Skills erscheint nicht.
#   skills:      jeder Skill eine Zeile.
#     id:        stabiler Schlüssel in kebab-case, nie umbenennen (Projekte,
#                foundations und die Seite verweisen darauf). Er muss nicht
#                zum Namen passen, „C#“ hat aus Gründen der Geschichte die id c.
#     name:      Anzeigename des Chips. Schrägstriche mit Leerzeichen („CI / CD“).
#     group:     id einer Gruppe oben.
#     tier:      core (Kern, obere Chip-Reihe) oder breadth (ergänzende Breite,
#                untere Reihe mit Trenner). Keine Rangordnung, nur Zweiteilung.
#     show:      true = sichtbar als Chip und im Graphen, false = nur im Katalog.
#                Einschalten: show auf true setzen, fertig.
#   foundations: Basis-Werkzeuge (generische Dev-Infra), die in fast jedem
#                Projekt stecken. BEWUSST ohne Projektkanten, sonst werden sie
#                zu Knoten, an denen alles hängt. Ein Klick zeigt eine eigene
#                „Basiswerkzeug“-Meldung statt einer Projektliste.
#   projects:    Projekte, die Skills im Graphen verbinden. id (stabil, nie
#                umbenennen), label (öffentlich und anonym, keine Kunden- oder
#                internen Namen), skills (Liste von Skill-ids, Basis-Werkzeuge
#                gehören nicht hinein). Ausgeblendete Skills dürfen hier
#                stehen, Seite und Graph zeigen nur die mit show: true.
#                Kanten Skill↔Skill entstehen im JS über gemeinsame Projekte,
#                hier bewusst keine Kantenlisten pflegen.
#   texts:       Bedientexte des Skill-Features (ganz unten, STYLEGUIDE ARCH-4).
#
# Kommentare hinter einer Zeile sind Notizen für die Pflege und erscheinen
# nirgends. Prüfung: python3 scripts/content-check.py (unbekannte ids und
# Gruppen, doppelte ids und Namen, sichtbare Skills ohne Projekt).
# Pflege-Anleitung: docs/pflege.md (Abschnitt „Skill einschalten, neu
# anlegen, Projekt ergänzen“), Technik: docs/features/skill-feature.md.
# =============================================================================
version: 1

