  # Derzeit ohne sichtbare Skills und deshalb nicht auf der Seite. Erscheint,
  # sobald hier ein Skill show: true bekommt.
  - id: methoden
    title: "Methoden & Zusammenarbeit"
    context: "Vom ersten Prototyp bis zur Abstimmung mit allen Beteiligten"

