title: Hans Müller # Kraftstoff
name: Hans Müller
description: Persönliche Website von Hans Müller – Ingenieur & Entwickler. Blog über Machine Learning, Fraktale, Programmierung und technische Projekte.
url: "https://grenzenloseSchublade.github.io"
baseurl: "/auflinie"
repository: "grenzenloseSchublade/auflinie"
logo: "/assets/images/Logo.svg"  # SVG für perfekte Transparenz (Alternative: Logo.png)

# Bild- und Performance-Einstellungen
background_image: "/assets/images/background.jpg"
# Alt-Text, wenn der Hero-Hintergrund als Vorschaubild (og:image) dient (_includes/seo.html)
background_image_alt: "Retro-Grafik: gestreifte Sonne in Magenta und Cyan über einem leuchtenden Gitterboden"
# Hero CRT-Overlay bei Hintergrundbild: "dezent" | "stark" (pro Seite: header.crt_intensity im Frontmatter; Standard: stark)
hero_crt_intensity: "stark"
enable_image_caching: true
enable_service_worker: true
# Präfix der eigenen CacheStorage-Einträge (STYLEGUIDE SEC-5c). Einzige Quelle:
# service-worker.js baut daraus CACHE_PREFIX, sw-register.js liest ihn aus
# data-sw-cache-prefix am <html> (_layouts/default.html). Alle Projekte unter
# grenzenloseSchublade.github.io teilen einen Origin, gelöscht wird nur, was
# mit diesem Präfix beginnt. Nie leer lassen.
sw_cache_prefix: "kraftstoff-cache-"

# Theme Einstellungen
remote_theme: "mmistakes/minimal-mistakes@81f00a619fafea2f2d457da8be4788edf06a90be" # 4.28.1 (Commit gepinnt, Tag ist verschiebbar)
# Skin-Wahl steht seit der @use-Migration fest in assets/_sass/_theme-bridge.scss
# (Sass-Partials laufen nicht durch Liquid). Der Schlüssel bleibt nur als Doku,
# ihn hier zu ändern wirkt nicht.
minimal_mistakes_skin: "dark"

# Textschrift für Fließtext, Überschriften und Navigation (STYLEGUIDE TYP-13):
#   ubuntu = Ubuntu, selbst gehostet (assets/webfonts/ubuntu-*.woff2), überall gleich
#   system = Systemschrift des Geräts. Die Ubuntu-Dateien bleiben im Repo,
#            werden aber nicht geladen (kein @font-face, kein Preload, kein Precache).
# Wirkt beim Build (assets/css/main.scss, _includes/head.html, service-worker.js).
# Nach dem Umschalten die Vergleichsbilder neu erzeugen (tests/README.md).
# Die Konsolenschrift ($mono-font-stack) hängt nicht daran.
text_font: "ubuntu"

# Site Settings
locale: "de-DE"
title_separator: "–" # Hausstil-Gedankenstrich im <title> (STYLEGUIDE SEO-1, TYPO-2)
search: false
# search_full_content und lunr werden nur benötigt wenn search: true
# search_full_content: true
# lunr:
#   search_within_pages: true

# Math Settings
markdown: kramdown
# mathjax: wird nur auf Page-Ebene aktiviert (z.B. mathjax: true im Frontmatter)
# Das verbessert die Performance, da MathJax nur bei Bedarf geladen wird
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
  input: GFM
  # Deutsche Anführungszeichen aus geraden " und ' (STYLEGUIDE TYPO-3):
  # „…“ und ‚…‘. Apostrophe wandelt kramdown dabei zu ‘ — deshalb im
  # Markdown immer direkt ’ (U+2019) tippen.
  smart_quotes: ["sbquo", "lsquo", "bdquo", "ldquo"]
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1
      background_color: "#2d2d2d"

# JavaScript-Dateien, die nach dem Footer geladen werden
# (back-to-top.js lädt nur im single-Layout, siehe _layouts/single.html)
after_footer_scripts:
  - /assets/js/tv-switch.js
  - /assets/js/author-follow.js
  - /assets/js/greedy-navigation.js

# Collections
include:
  - _pages

# SEO Related (bei Bedarf ausfüllen)
# google_site_verification:
# bing_site_verification:
# naver_site_verification:

# Social Sharing
twitter:
  card: "summary_large_image"
  # username: (bei Bedarf ausfüllen)
og_image: "/assets/images/WebSite_Logo_3.png" # Open Graph/Twitter default site image
og_image_alt: "Logo: Fackel mit Flamme über dem Schriftzug „German Kraftstoff – Fuel & Energy“"
social:
  type: "Person"
  name: "Hans Müller"
  links:
    - "https://github.com/grenzenloseSchublade"
    - "https://www.linkedin.com/in/hans-m%C3%BCller-39a133359/"

# Analytics (derzeit deaktiviert)
analytics:
  provider: false

# Site Author
author:
  name: "Hans Müller"
  avatar: "/assets/images/Logo.svg"
  bio: "Ingenieur & Entwickler"
  location: "Bochum, Deutschland"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/grenzenloseSchublade"
    - label: "Linked In"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/hans-m%C3%BCller-39a133359/"
    # - label: "Email"
    #   icon: "fas fa-fw fa-envelope-square"
    #   url: "mailto:ihre@email.de"

# Build settings
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Outputting
permalink: /posts/:title/
pagination:
  enabled: true
  per_page: 6
  # Wird an den Permalink der paginierten Seite (/posts/) ANGEHÄNGT —
  # ein /posts/-Präfix hier ergäbe /posts/posts/page2/.
  permalink: /page:num/
timezone: Europe/Berlin

# Plugins
plugins:
  - jekyll-paginate-v2
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-last-modified-at
  - jekyll-remote-theme

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: false
      related: true
      show_date: true
      show_categories: false
      show_tags: false
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - design-reference/ # Design-Referenzen, absichtlich nicht deployt (siehe design-reference/README.md)
  - Lebenslauf-soprasteria/ # VERTRAULICH: Arbeitsdokumente, nie in den Build/Deploy (auch in .gitignore)
  - tests/ # Playwright-Regressionstests (#6) — nicht deployen
  - playwright.config.js
  - eslint.config.mjs # Lint-Konfiguration, gehört nicht auf die Seite
  - scripts/ # Lint-/Analyse-Werkzeuge, gehören nicht auf die Seite
  - CONTRIBUTING.md
  - STYLEGUIDE.md # Regelwerk, nie deployen (Owner-Entscheidung, SG-1)
  - THIRD-PARTY-NOTICES.md # Repo-Doku wie README und LICENSE, gehört nicht auf die Seite
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - assets/vendor/SHA384SUMS # Prüfsummen der Vendor-Dateien (STYLEGUIDE SEC-8a), nur für die Prüfung
  - "*.sublime-project"
  - "*.sublime-workspace"
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs
  - /test

# Additional Styles
sass:
  sass_dir: assets/_sass
  style: compressed
  sourcemap: never
  # Deprecation-Warnungen im Build-Log ruhig halten: quiet_deps unterdrückt
  # Warnungen aus allen Dateien, die über einen Load-Path geladen werden. Das ist
  # das Theme (minimal-mistakes nutzt intern noch globale Funktionen, Sass-if(),
  # `/`-Division, @import), aber AUCH jedes eigene Partial unter assets/_sass.
  # Eigene Deprecations sieht man hier also nicht, dafür baut
  # scripts/sass-deprecation-check.sh im CI-Build-Job einmal ohne quiet_deps.
  # Ein silence_deprecations für [import] braucht es nicht mehr: main.scss lädt
  # nur noch per @use, das einzige eigene @import steht in der Theme-Brücke
  # (assets/_sass/_theme-bridge.scss, STYLEGUIDE.md SCSS-4).
  quiet_deps: true
