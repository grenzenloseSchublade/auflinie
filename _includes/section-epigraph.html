{% comment %}
  Epigraph am Abschnittsanfang: ein Zitat, ruhig gesetzt.
  Parameter: text, author
{% endcomment %}
<blockquote class="section-epigraph">
  <p class="section-epigraph__text">{{ include.text }}</p>
  <footer class="section-epigraph__author">— {{ include.author }}</footer>
</blockquote>
