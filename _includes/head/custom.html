<!-- start custom head snippets -->

<!-- Security Headers (nur die via meta unterstützten) -->
<!-- Hinweis: X-Frame-Options, Permissions-Policy und frame-ancestors erfordern HTTP-Header -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  img-src 'self' data: https:;
  font-src 'self' https://cdn.jsdelivr.net;
  connect-src 'self' https://cdn.jsdelivr.net;
  worker-src 'self' blob:;
  base-uri 'self';
  form-action 'self';
">

{% if page.fractal_panels %}
<!-- Fraktal-Panels: CSS der CDN-Libs einmal pro Seite (JS in fractal/deps.html) -->
<link href="{{ '/assets/vendor/nouislider.min.css' | relative_url }}" rel="stylesheet">
<link href="{{ '/assets/vendor/tom-select.css' | relative_url }}" rel="stylesheet">
{% endif %}

{% if page.mathjax %}
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      packages: { '[+]': ['noerrors'] }
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
      ignoreHtmlClass: 'tex2jax_ignore',
      processHtmlClass: 'tex2jax_process',
      menuOptions: {
        settings: {
          assistiveMml: true
        }
      }
    },
    loader: {
      load: ['[tex]/noerrors']
    },
    startup: {
      ready: function() {
        // Unterdrücke die Warnung für veraltete mathvariant-Attribute
        MathJax.startup.defaultReady();
        
        // Fehlerbehandlung für veraltete Attribute
        if (MathJax._?.input?.mathml?.MathMLCompile?.prototype?.error) {
          const originalCompileError = MathJax._.input.mathml.MathMLCompile.prototype.error;
          MathJax._.input.mathml.MathMLCompile.prototype.error = function(node, message) {
            if (message.match(/mathvariant='script'/)) {
              return null; // Unterdrücke diese spezifische Warnung
            }
            return originalCompileError.call(this, node, message);
          };
        }
      }
    }
  };
</script>
<script id="MathJax-script" async 
        src="https://cdn.jsdelivr.net/npm/mathjax@4.1.0/tex-chtml.js"
        integrity="sha384-eFoKTCK+YGO2m6R2Z5v7A6twgQ1+PfLq+elzUmXZzq5PMVnt5uwSR8L5rjlQoPJu"
        crossorigin="anonymous"></script>
{% endif %}

<!-- Favicon-Set für verschiedene Plattformen - Sokrates Line Art -->
<link rel="shortcut icon" type="image/x-icon" href="{{ site.baseurl }}/assets/images/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/assets/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/assets/images/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/assets/images/apple-touch-icon.png">
<meta name="theme-color" content="#1a1a1a">

<!-- Anpassungen für Header-Elemente -->
<style>
  /* Verbesserte Lesbarkeit für Header-Unterschrift */
  .page__hero--overlay .page__title,
  .page__hero--overlay .page__lead {
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
  }

  /* 
   * Hinweis: Die page__caption-Styles wurden entfernt und 
   * alle Caption-Stile sind jetzt zentral in main.scss definiert 
   */

  /* Verhindert Flackern beim Laden der Seite */
  html {
    scroll-behavior: smooth;
  }

  /* Versteckt den Inhalt kurz beim Laden, um Sprünge zu vermeiden */
  .page-loading {
    opacity: 0;
    transition: opacity 0.3s ease-in;
  }

  .page-loaded {
    opacity: 1;
  }

  /* Taxonomie-Metadaten (Kategorien/Tags) sind sitewide deaktiviert */
  .page__taxonomy,
  .page__taxonomy-item,
  .taxonomy__index,
  .archive__item-excerpt .page__meta {
    display: none !important;
  }

  /* Anmerkung: Die dynamischen Header-Stile wurden in masthead.html verschoben */

  /* Stil für Anker-Ziele */
  .anchor-target {
    display: block;
    position: relative;
    top: -80px;
    /* Anpassen je nach Header-Höhe */
    visibility: hidden;
  }
</style>

{% if site.background_image %}
<link rel="preload" as="image" href="{{ site.background_image | relative_url }}">
{% endif %}
<!-- Speculation Rules: Prerender interner Links (Chromium) — macht zusätzlich
     zum SW-Cache auch das RENDERN der Zielseite instant; /mandelbrot/ wegen
     Worker-/MathJax-Last ausgenommen; andere Browser ignorieren das folgenlos -->
<script type="speculationrules">
{
  "prerender": [{
    "where": { "and": [
      { "href_matches": "{{ site.baseurl }}/*" },
      { "not": { "href_matches": "{{ site.baseurl }}/mandelbrot/*" } }
    ]},
    "eagerness": "moderate"
  }]
}
</script>

<!-- Konfiguration für Bild-Caching und Service Worker -->
<script>
  // Konfiguration aus _config.yml an das HTML-Dokument übergeben.
  // WICHTIG: data-enable-service-worker wird hier NICHT mehr gesetzt —
  // das Attribut kommt serverseitig aus _layouts/default.html und ist dort
  // env-gegated (nur Production). Das frühere Laufzeit-Override erzwang
  // "true" auch im Dev-Betrieb und hielt die Update-Dauerschleife am Leben.
  document.documentElement.setAttribute('data-enable-image-caching', '{% if site.enable_image_caching != false %}true{% else %}false{% endif %}');
  document.documentElement.setAttribute('data-background-image', '{{ site.background_image | relative_url }}');
</script>

<!-- insert favicons. use https://realfavicongenerator.net/ -->

<!-- Strukturierte Daten (JSON-LD) für SEO -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "{% if page.layout == 'single' and page.date %}BlogPosting{% else %}WebPage{% endif %}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  },
  "headline": "{{ page.title | default: site.title | escape }}",
  "description": "{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 | escape }}",
  {% if page.header.overlay_image or site.og_image %}
  "image": "{{ page.header.overlay_image | default: site.og_image | absolute_url }}",
  {% endif %}
  {% if page.date %}
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  {% endif %}
  "author": {
    "@type": "Person",
    "name": "{{ site.author.name | default: site.name }}",
    "url": "{{ site.url }}"
  },
  "publisher": {
    "@type": "Person",
    "name": "{{ site.author.name | default: site.name }}",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ site.logo | absolute_url }}"
    }
  }
}
</script>

<!-- Person Schema für About-Seite -->
{% if page.url == "/about/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.author.name }}",
  "url": "{{ site.url }}{{ site.baseurl }}",
  "image": "{{ site.author.avatar | absolute_url }}",
  "jobTitle": "{{ site.author.bio }}",
  "address": {
    "@type": "PostalAddress",
    "addressCountry": "DE"
  },
  "sameAs": [
    {% for link in site.social.links %}"{{ link }}"{% unless forloop.last %},{% endunless %}
    {% endfor %}]
}
</script>
{% endif %}

<!-- end custom head snippets -->
