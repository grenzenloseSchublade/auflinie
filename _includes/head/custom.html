<!-- start custom head snippets -->

{% if page.styleguide %}
<!-- Styleguide-Ansicht (nie veröffentlicht, STYLEGUIDE.md SG-1) -->
<link href="{{ '/assets/css/styleguide.css' | relative_url }}" rel="stylesheet">
{% endif %}

{% if page.fractal_panels %}
<!-- Fraktal-Panels: CSS der CDN-Libs einmal pro Seite (JS in fractal/deps.html) -->
<link href="{{ '/assets/vendor/nouislider.min.css' | relative_url }}" rel="stylesheet">
<link href="{{ '/assets/vendor/tom-select.css' | relative_url }}" rel="stylesheet">
{% endif %}

{% if page.mathjax %}
<!-- MathJax 4.1.3, selbst gehostet (assets/vendor/mathjax + Font-Paket):
     kein CDN, offline-fähig, vom SPA-Reconcile nachladbar. Reihenfolge
     (defer bzw. Reconcile mit async=false): Config -> Kern -> Typeset-Hook.
     Die Config liegt als Datei vor, weil spa-nav nur script[src] nachlädt. -->
<script src="{{ '/assets/js/mathjax-config.js' | relative_url }}" defer></script>
<script id="MathJax-script" defer src="{{ '/assets/vendor/mathjax/tex-chtml.js' | relative_url }}"></script>
<script src="{{ '/assets/js/mathjax-typeset.js' | relative_url }}" defer></script>
{% endif %}

<!-- Favicon-Set für verschiedene Plattformen - Sokrates Line Art -->
<link rel="shortcut icon" type="image/x-icon" href="{{ site.baseurl }}/assets/images/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/assets/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/assets/images/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/assets/images/apple-touch-icon.png">
<meta name="theme-color" content="#1a1a1a">

{% if site.background_image %}
<link rel="preload" as="image" href="{{ site.background_image | relative_url }}">
{% endif %}
<!-- Speculation Rules: Prerender interner Links (Chromium) – macht zusätzlich
     zum SW-Cache auch das RENDERN der Zielseite instant; /mandelbrot/ wegen
     Worker-/MathJax-Last ausgenommen; andere Browser ignorieren das folgenlos.
     Drawer-Links ausgenommen: der Prerender startete sonst mitten im
     Drawer-Exit (moderate feuert ab Chrome 138 schon nach Scroll-Stopp)
     und stahl dem Compositor die CPU – der SW-Voll-Precache macht die
     Drawer-Ziele ohnehin instant.
     Wired-Set (/, /about/, /cv/, /posts/*) komplett ausgenommen: diese Ziele
     fängt spa-nav.js als SPA-Swap ab (preventDefault) -> ein Prerender würde
     beim Klick verworfen (verschwendete Renderarbeit + Bandbreite). Für sie
     übernehmen Prefetch-on-Intent + SW-Precache; MathJax-Posts (needsFullLoad
     -> Voll-Reload) bleiben über den SW-Cache trotzdem schnell. Prerender
     wirkt damit nur noch auf NICHT verdrahtete Ziele (Archive o.ä.). -->
<script type="speculationrules">
{
  "prerender": [{
    "where": { "and": [
      { "href_matches": "{{ site.baseurl }}/*" },
      { "not": { "href_matches": "{{ site.baseurl }}/mandelbrot/*" } },
      { "not": { "href_matches": "{{ site.baseurl }}/" } },
      { "not": { "href_matches": "{{ site.baseurl }}/about/*" } },
      { "not": { "href_matches": "{{ site.baseurl }}/cv/*" } },
      { "not": { "href_matches": "{{ site.baseurl }}/posts/*" } },
      { "not": { "selector_matches": ".greedy-nav .hidden-links a" } }
    ]},
    "eagerness": "moderate"
  }]
}
</script>

<!-- insert favicons. use https://realfavicongenerator.net/ -->

<!-- Strukturierte Daten (JSON-LD) für SEO -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "{% if page.layout == 'single' and page.date %}BlogPosting{% else %}WebPage{% endif %}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  },
  {% comment %} seo_title zuerst; page.title kann Markup tragen (Startseiten-
  Neon-Spans) – strip_html, sonst landet escapter HTML-Müll in der headline {% endcomment %}
  "headline": "{{ page.seo_title | default: page.title | default: site.title | markdownify | strip_html | strip_newlines | escape }}",
  "description": "{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 | escape }}",
  {% if page.header.overlay_image or site.og_image %}
  "image": "{{ page.header.overlay_image | default: site.og_image | absolute_url }}",
  {% endif %}
  {% if page.date %}
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  {% endif %}
  "author": {
    "@type": "Person",
    "name": {{ site.author.name | default: site.name | jsonify }},
    "url": "{{ site.url }}"
  },
  "publisher": {
    "@type": "Person",
    "name": {{ site.author.name | default: site.name | jsonify }},
    "logo": {
      "@type": "ImageObject",
      "url": "{{ site.logo | absolute_url }}"
    }
  }
}
</script>

<!-- Person Schema für About-Seite -->
{% if page.url == "/about/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ site.author.name | jsonify }},
  "url": "{{ site.url }}{{ site.baseurl }}",
  "image": "{{ site.author.avatar | absolute_url }}",
  "jobTitle": {{ site.author.bio | jsonify }},
  "address": {
    "@type": "PostalAddress",
    "addressCountry": "DE"
  },
  "sameAs": [
    {% for link in site.social.links %}{{ link | jsonify }}{% unless forloop.last %},{% endunless %}
    {% endfor %}]
}
</script>
{% endif %}

<!-- end custom head snippets -->
