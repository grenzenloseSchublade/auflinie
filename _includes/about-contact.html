{% for contact in include.contact_info %}
<a href="{{ contact.link }}" class="contact-card" target="_blank" rel="noopener noreferrer" aria-label="{{ contact.type }}: {{ contact.value }}">
    <div class="contact-icon">
        {% include brand-icon.html icon=contact.icon %}
    </div>
    <div class="contact-info">
        <span class="contact-type">{{ contact.type }}</span>
        <span class="contact-value">{{ contact.value }}</span>
    </div>
</a>
{% endfor %}
