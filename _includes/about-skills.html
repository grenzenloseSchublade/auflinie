<div class="skills-container">
{% for skill_category in include.skill_categories %}
<div class="skill-card">
    <h3 class="card-heading"><i class="fas fa-{{ skill_category.icon | default: 'star' }}" aria-hidden="true"></i> {{ skill_category.category }}</h3>
    <ul class="skill-list">
        {% for item in skill_category.items %}
        <li>{{ item }}</li>
        {% endfor %}
    </ul>
</div>
{% endfor %}
</div>
